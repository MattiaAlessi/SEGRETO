[package]
name = "crypto_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "crypto_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
chacha20poly1305 = { version = "0.10", features=["std"]}
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2" }
argon2 = { version = "0.5", features = ["std"] }
blake2 = "0.10"
rand = "0.8"
