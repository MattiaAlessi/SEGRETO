<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEGRETO -- encrypted chat</title>

</head>
<body>
  <div class="app">

    <section id="screen-home" class="screen active">
      <h1>Chat</h1>
      <p class="sub">messages are crypted</p>
      <button onclick="showScreen('screen-create')">New room</button>
      <button class="secondary" onclick="showScreen('screen-join')">Enter with code</button>
      <p class="lock">demo</p>
    </section>

    <section id="screen-create" class="screen">
      <h1>Create room</h1>
      <p class="sub">Send link to friedn</p>
      <input id="room-code" readonly placeholder="Code here">
      <button onclick="createRoom()">Create code</button>
      <button class="secondary" onclick="showScreen('screen-home')">Back</button>
    </section>

    <section id="screen-join" class="screen">
      <h1>Enter in a room</h1>
      <input id="join-code" placeholder="Incolla il codice della stanza">
      <button onclick="joinRoom()">Connect</button>
      <button class="secondary" onclick="showScreen('screen-home')">Back</button>
    </section>

    <section id="screen-chat" class="screen">
      <header>
        <strong>Chat</strong>
        <span id="status" class="lock">conenssion...</span>
      </header>
      <div id="messages"></div>
      <form onsubmit="sendMessage(); return false;">
        <input id="text-input" placeholder="Write message..." autocomplete="off">
        <button>Invia</button>
      </form>
    </section>

  </div>

  
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function createRoom() {
      document.getElementById('room-code').value =
        Math.random().toString(36).slice(2, 10).toUpperCase();
    }
    function joinRoom() {
      const code = document.getElementById('join-code').value.trim();
      if (code) showScreen('screen-chat');
    }
    function sendMessage() {
      const input = document.getElementById('text-input');
      addMessage(input.value, true);
      input.value = '';
    }
    function addMessage(text, mine) {
      const div = document.createElement('div');
      div.className = 'msg' + (mine ? ' me' : '');
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
    }

    
  </script>
</body>
</html>
